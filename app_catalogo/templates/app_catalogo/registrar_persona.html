{% extends "app_catalogo/base.html" %}

{% block title %}Registrar persona{% endblock %}

{% block content %}
    <h1>Registrar persona</h1>

    <form method="post" action="{% url 'registrar_persona' %}">
        {% csrf_token %}

        <label for="nombre">Nombre completo:</label>
        <input type="text" id="nombre" name="nombre" required placeholder="Nombre completo" value="{{ nombre|default:'' }}">
        <br><br>

        <label for="tipo_documento">Tipo de documento:</label>
        <select id="tipo_documento" name="tipo_documento" required>
            <option value="">-- Selecciona una opción --</option>
            <option value="CC" {% if tipo_documento == "CC" %}selected{% endif %}>Cédula de ciudadanía</option>
            <option value="TI" {% if tipo_documento == "TI" %}selected{% endif %}>Tarjeta de identidad</option>
            <option value="CE" {% if tipo_documento == "CE" %}selected{% endif %}>Cédula de extranjería</option>
            <option value="PA" {% if tipo_documento == "PA" %}selected{% endif %}>Pasaporte</option>
        </select>
        <br><br>

        <label for="numero_documento">Número de documento:</label>
        <input type="text" id="numero_documento" name="numero_documento" required placeholder="Número de documento" value="{{ numero_documento|default:'' }}">
        <br><br>

        <label for="telefono">Número de teléfono:</label>
        <input type="tel" id="telefono" name="telefono" required placeholder="Número de teléfono" value="{{ telefono|default:'' }}">
        <br><br>

        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" name="correo" required placeholder="tucorreo@ejemplo.com" value="{{ correo|default:'' }}">
        <br><br>

        <label for="fecha_nacimiento">Fecha de nacimiento:</label>
        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required value="{{ fecha_nacimiento|default:'' }}">
        <br><br>

        <label for="genero">Género:</label>
        <select id="genero" name="genero" required>
            <option value="">-- Selecciona una opción --</option>
            <option value="M" {% if genero == "M" %}selected{% endif %}>Masculino</option>
            <option value="F" {% if genero == "F" %}selected{% endif %}>Femenino</option>
        </select>
        <br><br>

        <label for="rol">Rol de usuario:</label>
        <select id="rol" name="rol" required>
            <option value="">-- Selecciona una opción --</option>
            <option value="usuario" {% if rol == "usuario" %}selected{% endif %}>Usuario</option>
            <option value="estudiante" {% if rol == "estudiante" %}selected{% endif %}>Estudiante</option>
            <option value="instructor" {% if rol == "instructor" %}selected{% endif %}>Instructor</option>
            <option value="admin" {% if rol == "admin" %}selected{% endif %}>Administrador</option>
        </select>
        <br><br>

        <button type="submit">Registrar persona</button>
    </form>

    {% if registrado %}
        <p>{{ nombre }} fue registrado correctamente.</p>
    {% endif %}

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}
{% endblock %}
