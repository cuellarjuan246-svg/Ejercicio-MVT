<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Catálogo{% endblock %}</title>
    <style>
        body {
            background-color: #6e6f65;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #3b35dc;
            color: rgb(229, 223, 223);
            padding: 10px 0;
        }
        nav {
            display: flex;
            justify-content: center;
        }
        nav a {
            color: rgb(0, 0, 0);
            text-decoration: none;
            margin: 0 15px;
        }
        nav a:hover {
            text-decoration: underline;
        }
        main {
            padding: 20px;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'inicio' %}">Inicio</a>
            <a href="{% url 'lista_libros' %}">Libros</a>
            <a href="{% url 'autores' %}">Autores</a>
            <a href="{% url 'reporte' %}">Estadísticas</a>
            <a href="{% url 'sugerir' %}">Sugerir un libro</a>
            <a href="{% url 'acerca' %}">Acerca de</a>
            <a href="{% url 'contacto' %}">Contacto</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
